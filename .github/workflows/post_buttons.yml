name: Post photo buttons

on:
  workflow_dispatch:   # 手動で1回だけ実行する

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python post_buttons.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_BUTTON_CHANNEL_ID: ${{ secrets.DISCORD_BUTTON_CHANNEL_ID }}
